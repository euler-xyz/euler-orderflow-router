name: Build

on:
  pull_request:
  push:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:unit
      - run: pnpm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: |
            NODE_BUILD_IMAGE=node:24.22.1-trixie-slim
            NODE_RUNTIME_IMAGE=gcr.io/distroless/nodejs24-debian13:nonroot
          platforms: linux/amd64
          push: false
          load: true
          tags: euler-orderflow-router:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime imports and user
        run: >-
          docker run --rm --network none euler-orderflow-router:ci
          -e 'require("./dist/server.js");
          if (process.getuid() === 0) throw new Error("Runtime must run as nonroot")'
